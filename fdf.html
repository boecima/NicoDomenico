<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F.D.F. · Stabilimento di Bosco Capitolo</title>
<meta name="description" content="Pratica F.D.F.: modello 3D interattivo dello stabilimento di Bosco Capitolo, Pannarano. Studio arch. Franco Nicola.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* Intro notturna: un solo aspetto scelto di proposito (cielo di notte), indipendente dal tema */
:root{
  --notte:#0C1217; --notte-2:#131C23; --luce:#EEF2F4; --luce-soft:#9FAEB8;
  --cobalto:#7F95F0; --oro:#F2B65A; --segnale:#F06A2B;
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--notte);color:var(--luce);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fine{position:fixed;inset:0;display:grid;place-items:center;text-align:center;
  padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  opacity:0;transition:opacity .2s linear;pointer-events:none}
.fine.on{opacity:1;pointer-events:auto}
.fine .blocco{display:grid;gap:18px;justify-items:center;max-width:720px}
.sigla{font-stretch:125%;font-weight:200;font-size:clamp(56px,13vw,150px);letter-spacing:.06em;line-height:.9;margin:0}
.sigla b{font-weight:200;color:var(--oro)}
.titolo{font-stretch:112%;font-weight:400;font-size:clamp(18px,2.6vw,28px);margin:0;text-wrap:balance}
.sotto{font-stretch:75%;font-weight:500;font-size:clamp(13px,1.5vw,16px);letter-spacing:.18em;text-transform:uppercase;color:var(--luce-soft);margin:0}
.azioni{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.btn{font:inherit;font-size:16px;font-weight:500;text-decoration:none;color:var(--notte);background:var(--luce);border:1px solid var(--luce);padding:12px 22px;border-radius:999px;transition:background .3s,color .3s}
.btn:hover{background:transparent;color:var(--luce)}
.btn.sec{background:transparent;color:var(--luce);border-color:color-mix(in srgb,var(--luce) 45%,transparent)}
.btn.sec:hover{border-color:var(--luce)}
.nota{font-size:13px;color:var(--luce-soft);max-width:52ch;margin:4px 0 0}
.salta{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:max(20px,env(safe-area-inset-bottom));z-index:3;font:inherit;font-size:14px;color:var(--luce);
  background:transparent;border:1px solid color-mix(in srgb,var(--luce) 40%,transparent);padding:8px 14px;border-radius:999px;cursor:pointer;transition:opacity .4s}
.salta[hidden]{display:none}
:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
</style>
</head>
<body>
<canvas id="cielo" aria-hidden="true"></canvas>
<section class="fine" id="fine" aria-live="polite">
  <div class="blocco">
    <p class="sotto">Pannarano (BN) · località Bosco Capitolo</p>
    <h1 class="sigla">F<b>·</b>D<b>·</b>F</h1>
    <p class="titolo">Stabilimento di Bosco Capitolo · modello 3D interattivo</p>
    <div class="azioni">
      <a class="btn" id="apri" href="https://claude.ai/artifact/4seGeXvN64MUtZLiXy6oCP">Apri il modello 3D</a>
      <a class="btn sec" href="v2/">← Torna alla home</a>
    </div>
    <p class="nota">Terreno dal rilievo, sezioni, disegni originali, scheda di ogni edificio e passeggiata. Studio arch. Franco Nicola.</p>
  </div>
</section>
<button class="salta" id="salta" type="button">Salta</button>
<script>
(function(){
  const cv=document.getElementById('cielo'), g=cv.getContext('2d'), fine=document.getElementById('fine'), salta=document.getElementById('salta');
  let W=0,H=0,DPR=1;
  function dim(){ DPR=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; cv.width=W*DPR; cv.height=H*DPR; g.setTransform(DPR,0,0,DPR,0,0); }
  dim(); addEventListener('resize',()=>{ dim(); bersagli(); });

  const ridotto=matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ---- scrittura finale: un secondo scoppio di pixel finissimi (colori del fuoco) che va a comporre il testo ----
  const blocco=fine.querySelector('.blocco');
  const STIRA={'62.5%':'extra-condensed','75%':'condensed','87.5%':'semi-condensed','100%':'normal','112%':'semi-expanded','112.5%':'semi-expanded','125%':'expanded'};
  const COLORI=['242,182,90','127,149,240','240,106,43','238,242,244'];
  let SC=null;                                  // stato della scrittura: particelle, inizio
  function bersagliTesto(){
    // ridisegno su una tela nascosta le righe del blocco finale, nella stessa posizione e con lo stesso carattere
    const t=document.createElement('canvas'); t.width=W; t.height=H; const x=t.getContext('2d'); x.textBaseline='alphabetic';
    const righe=[];
    blocco.querySelectorAll('.sotto,.sigla,.titolo,.nota,.btn').forEach(el=>{
      const cs=getComputedStyle(el), r=el.getBoundingClientRect(); if(!r.width) return;
      let testo=el.textContent.trim(); if(cs.textTransform==='uppercase') testo=testo.toUpperCase();
      x.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; try{ x.fontStretch=STIRA[cs.fontStretch]||'normal'; }catch(e){}
      try{ x.letterSpacing=cs.letterSpacing==='normal'?'0px':cs.letterSpacing; }catch(e){}
      x.textAlign='center'; const lh=parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.25, padL=parseFloat(cs.paddingLeft)||0, padR=parseFloat(cs.paddingRight)||0;
      // a capo come nel testo vero, sulla larghezza del riquadro
      const larg=r.width-padL-padR, parole=testo.split(/\s+/), linee=[]; let cur='';
      for(const w of parole){ const prova=cur?cur+' '+w:w; if(x.measureText(prova).width>larg+1&&cur){ linee.push(cur); cur=w; } else cur=prova; } if(cur) linee.push(cur);
      const m=x.measureText('Hg'), asc=m.actualBoundingBoxAscent, disc=m.actualBoundingBoxDescent;
      const top=r.top+(parseFloat(cs.paddingTop)||0), hTot=r.height-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
      const y0=top+(hTot-linee.length*lh)/2;
      const oro=el.classList.contains('sigla');
      linee.forEach((l,i)=>{ const y=y0+i*lh+(lh+asc-disc)/2; righe.push({l,x:r.left+padL+larg/2,y,font:x.font,stira:x.fontStretch,sp:x.letterSpacing,oro,
        colore:el.classList.contains('btn')&&!el.classList.contains('sec')?'12,18,23':'238,242,244'}); });
      if(el.classList.contains('btn')){ // contorno della pillola
        righe.push({pill:r, colore:el.classList.contains('sec')?'159,174,184':'238,242,244', pieno:!el.classList.contains('sec')}); }
    });
    const P=[];
    for(const R of righe){
      x.clearRect(0,0,W,H);
      if(R.pill){ const r=R.pill, rr=r.height/2; x.beginPath(); x.roundRect?x.roundRect(r.left,r.top,r.width,r.height,rr):x.rect(r.left,r.top,r.width,r.height);
        if(R.pieno){ x.fillStyle='#fff'; x.fill(); } else { x.strokeStyle='#fff'; x.lineWidth=1.2; x.stroke(); } }
      else { x.font=R.font; try{ x.fontStretch=R.stira; x.letterSpacing=R.sp; }catch(e){} x.fillStyle='#fff'; x.fillText(R.l,R.x,R.y); }
      const bx=R.pill?R.pill:{left:R.x-W,top:R.y-200,width:2*W,height:260};
      const X0=Math.max(0,Math.floor(bx.left-4)), Y0=Math.max(0,Math.floor(bx.top-4)), X1=Math.min(W,Math.ceil(bx.left+bx.width+4)), Y1=Math.min(H,Math.ceil(bx.top+bx.height+4));
      if(X1<=X0||Y1<=Y0) continue;
      const d=x.getImageData(X0,Y0,X1-X0,Y1-Y0).data, w=X1-X0, passo=R.pill&&R.pieno?2:1;
      for(let yy=0;yy<Y1-Y0;yy+=passo) for(let xx=0;xx<w;xx+=passo){ if(d[(yy*w+xx)*4+3]>110) P.push([X0+xx,Y0+yy,R.colore,R.oro]); }
    }
    // i puntini centrali della sigla in oro
    const sig=blocco.querySelector('.sigla'); const dots=[...sig.querySelectorAll('b')].map(b=>b.getBoundingClientRect());
    P.forEach(q=>{ if(q[3]&&dots.some(r=>q[0]>=r.left&&q[0]<=r.right&&q[1]>=r.top&&q[1]<=r.bottom)) q[2]='242,182,90'; });
    // al massimo ~9000 pixel: oltre si sceglie a caso
    for(let k=P.length-1;k>0;k--){ const j=(Math.random()*(k+1))|0; [P[k],P[j]]=[P[j],P[k]]; }
    return P.slice(0,9000);
  }
  function avviaScrittura(){
    const P=bersagliTesto(), cx=W/2, cy=H*0.44, R0=Math.min(W,H);
    SC={t0:performance.now(),p:P.map(([tx,ty,col])=>{ const a=Math.random()*6.283, v=R0*(0.25+Math.random()*0.75);
      return {x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,tx,ty,col,fuoco:COLORI[(Math.random()*COLORI.length)|0],rit:Math.random()*0.35,ax:0,ay:0}; })};
  }
  function disegnaScrittura(){
    if(!SC) return false;
    const u=(performance.now()-SC.t0)/1000, VOLO=0.55, ARRIVO=1.25, FINE=VOLO+ARRIVO+0.35;
    const lotti={};
    for(const p of SC.p){
      let x,y,col;
      if(u<VOLO){ const k=Math.exp(-3.2*u); x=W/2+p.vx*(1-k)/3.2; y=H*0.44+p.vy*(1-k)/3.2; p.ax=x; p.ay=y; col=p.fuoco; }
      else { const w=cl((u-VOLO-p.rit)/(ARRIVO-0.35)), e=w<.5?4*w*w*w:1-Math.pow(-2*w+2,3)/2;
        x=p.ax+(p.tx-p.ax)*e; y=p.ay+(p.ty-p.ay)*e; col=e>0.85?p.col:p.fuoco;
        if(e<1&&e>0){ x+=(Math.random()-.5)*(1-e)*2; y+=(Math.random()-.5)*(1-e)*2; } }   // tremolio da rumore che si placa all'arrivo
      (lotti[col]||(lotti[col]=[])).push(x,y);
    }
    const al=u>VOLO+ARRIVO?cl(1-(u-VOLO-ARRIVO)/0.35):1;
    for(const c in lotti){ g.fillStyle=`rgba(${c},${al})`; const a=lotti[c]; for(let i=0;i<a.length;i+=2) g.fillRect(a[i],a[i+1],1.1,1.1); }
    if(u>VOLO+ARRIVO-0.05&&!fine.classList.contains('on')) fine.classList.add('on');   // il testo vero prende il posto dei pixel
    if(u>FINE){ SC=null; return false; }
    return true;
  }
  function mostraFine(subito){
    salta.hidden=true;
    if(subito||ridotto){ fine.classList.add('on'); return; }
    avviaScrittura(); if(!vivo) requestAnimationFrame(soloScrittura);
  }
  let vivo=true;
  function soloScrittura(){ g.fillStyle='rgba(12,18,23,0.32)'; g.fillRect(0,0,W,H); if(disegnaScrittura()) requestAnimationFrame(soloScrittura); else { g.fillStyle='rgba(12,18,23,1)'; g.fillRect(0,0,W,H); stelleFisse&&stelleFisse(); } }
  if(ridotto){ mostraFine(true); stelle(); return; }

  // ---- punti delle lettere FDF: si campiona il testo disegnato su una tela nascosta ----
  const N=Math.round(Math.min(420,Math.max(220,W*H/4200)));
  let target=[];
  function bersagli(){
    const t=document.createElement('canvas'), w=600, h=220; t.width=w; t.height=h; const x=t.getContext('2d');
    x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.font='300 190px Archivo, Helvetica Neue, Arial, sans-serif';
    x.fillText('FDF',w/2,h/2+6);
    const d=x.getImageData(0,0,w,h).data, P=[];
    for(let y=0;y<h;y+=3) for(let i=0;i<w;i+=3) if(d[(y*w+i)*4+3]>128) P.push([i,y]);
    // scelgo N punti ben distribuiti
    for(let k=P.length-1;k>0;k--){ const j=(Math.random()*(k+1))|0; [P[k],P[j]]=[P[j],P[k]]; }
    const sc=Math.min(W*0.78/w, H*0.42/h), ox=W/2-w*sc/2, oy=H*0.44-h*sc/2;
    target=P.slice(0,N).map(([i,y])=>[ox+i*sc, oy+y*sc]);
  }
  bersagli();

  // ---- droni ----
  const D=Array.from({length:N},(_,k)=>({x:W*(0.08+0.84*Math.random()), y:H+20+Math.random()*H*0.25, ritardo:Math.random()*0.7, fase:Math.random()*6.28}));
  const C=[W/2,H*0.44];
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2, salita=t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2, cl=v=>Math.max(0,Math.min(1,v));
  // tempi (secondi): salita lenta 0–2.7, lettere ferme fino a 3.6, raccolta 3.6–4.3, scoppio lungo 4.3–7.4
  const T1=2.7,T2=3.6,T3=4.3,T4=7.4;

  // ---- scintille dello scoppio ----
  let S=[]; let scoppiato=false;
  function scoppio(){
    scoppiato=true; const raggi=Math.round(Math.min(140,60+N/3));
    for(let k=0;k<raggi;k++){
      const a=k/raggi*Math.PI*2+Math.random()*0.04, v=(Math.min(W,H)*0.95)*(0.75+Math.random()*0.35);
      const oro=k%3!==0;
      S.push({x:C[0],y:C[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:oro?'242,182,90':'127,149,240',t:0,vita:2.7+Math.random()*0.6,traccia:[]});
    }
    // corona interna, piu' corta
    for(let k=0;k<36;k++){ const a=k/36*Math.PI*2, v=Math.min(W,H)*0.55;
      S.push({x:C[0],y:C[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v,c:'240,106,43',t:0,vita:1.7,traccia:[]}); }
  }

  let stelleArr=null;
  function stelle(){ stelleArr=Array.from({length:90},()=>[Math.random()*W,Math.random()*H*0.8,Math.random()*0.9+0.2]); }
  stelle();

  let t0=null, ultimo=0, finito=false;
  function frame(ts){
    if(t0===null){ t0=ts; ultimo=ts; }
    const t=(ts-t0)/1000, dt=Math.min(0.05,(ts-ultimo)/1000); ultimo=ts;
    // fondo con leggera scia
    g.fillStyle='rgba(12,18,23,0.24)'; g.fillRect(0,0,W,H);
    // stelle
    g.fillStyle='rgba(238,242,244,0.55)'; for(const [x,y,r] of stelleArr){ g.globalAlpha=0.25+0.25*Math.sin(t*2+x); g.fillRect(x,y,r,r); } g.globalAlpha=1;

    if(t<T3+0.02){
      for(let k=0;k<N;k++){
        const d=D[k], q=target[k]||C; let x,y,a=1,r=1.6;
        if(t<T1){ const u=salita(cl((t-d.ritardo)/(T1-d.ritardo))); x=d.x+(q[0]-d.x)*u+Math.sin(t*3+d.fase)*(1-u)*14; y=d.y+(q[1]-d.y)*u; a=0.35+0.65*u; }
        else if(t<T2){ x=q[0]+Math.sin(t*4+d.fase)*0.6; y=q[1]+Math.cos(t*3+d.fase)*0.6; r=1.6+0.5*Math.sin(t*6+d.fase); }
        else { const u=ease(cl((t-T2)/(T3-T2))); x=q[0]+(C[0]-q[0])*u; y=q[1]+(C[1]-q[1])*u; a=1; r=1.6+u*1.2; }
        // alone
        const gr=g.createRadialGradient(x,y,0,x,y,r*5); gr.addColorStop(0,`rgba(238,242,244,${0.9*a})`); gr.addColorStop(0.35,`rgba(127,149,240,${0.35*a})`); gr.addColorStop(1,'rgba(127,149,240,0)');
        g.fillStyle=gr; g.beginPath(); g.arc(x,y,r*5,0,6.283); g.fill();
      }
      if(t>T2){ // nucleo che si accende al centro
        const u=cl((t-T2)/(T3-T2)), rr=4+u*16; const gr=g.createRadialGradient(C[0],C[1],0,C[0],C[1],rr*3);
        gr.addColorStop(0,`rgba(255,244,220,${u})`); gr.addColorStop(1,'rgba(242,182,90,0)'); g.fillStyle=gr; g.beginPath(); g.arc(C[0],C[1],rr*3,0,6.283); g.fill();
      }
    }
    if(t>=T3 && !scoppiato) scoppio();
    if(scoppiato){
      // lampo iniziale
      const f=cl(1-(t-T3)/0.5); if(f>0){ const R=Math.min(W,H)*0.35, gl=g.createRadialGradient(C[0],C[1],0,C[0],C[1],R); gl.addColorStop(0,`rgba(255,240,215,${0.35*f})`); gl.addColorStop(1,'rgba(255,240,215,0)'); g.fillStyle=gl; g.beginPath(); g.arc(C[0],C[1],R,0,6.283); g.fill(); }
      g.lineCap='round';
      for(const p of S){
        p.t+=dt; if(p.t>p.vita) continue;
        const k=p.t/p.vita, att=Math.exp(-2.6*p.t);
        p.x+=p.vx*att*dt; p.y+=p.vy*att*dt+ 12*p.t*dt;       // via velocissima, poi l'aria frena e le scintille scendono piano
        p.traccia.push([p.x,p.y]); if(p.traccia.length>9) p.traccia.shift();
        const al=Math.pow(1-k,1.6);
        g.strokeStyle=`rgba(${p.c},${al})`; g.lineWidth=1.4*(1-k)+0.3; g.beginPath();
        p.traccia.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y)); g.stroke();
        if(k>0.5 && Math.random()<0.3){ g.fillStyle=`rgba(255,236,200,${al})`; g.fillRect(p.x,p.y,1.2,1.2); } // scintillio finale
      }
    }
    if(t>T4-1.6 && !finito){ finito=true; mostraFine(); }
    const scrive=disegnaScrittura();
    if(t<T4+1.6 || scrive) requestAnimationFrame(frame);
    else { vivo=false; g.fillStyle='rgba(12,18,23,1)'; g.fillRect(0,0,W,H); stelleFisse(); }
  }
  function stelleFisse(){ g.fillStyle='rgba(238,242,244,0.4)'; for(const [x,y,r] of stelleArr) g.fillRect(x,y,r,r); }
  // si parte quando il carattere e' pronto (le lettere si campionano con Archivo), al massimo dopo 600 ms
  const via=()=>{ bersagli(); g.fillStyle='#0C1217'; g.fillRect(0,0,W,H); requestAnimationFrame(frame); };
  (document.fonts&&document.fonts.load ? Promise.race([document.fonts.load('300 190px Archivo'),new Promise(r=>setTimeout(r,600))]) : Promise.resolve()).then(via);
  salta.onclick=()=>{ t0=-1e9; scoppiato=true; S=[]; finito=true; mostraFine(); };
})();
</script>
</body>
</html>
