<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Franco Nicola architetto · Pipicelli DomenicAntonio, soluzioni ed idee</title>
<meta name="description" content="Studio a Benevento: Franco Nicola, architetto, e Pipicelli DomenicAntonio, soluzioni ed idee.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* stile comune */
:root{
  --paper:#E8ECEA; --paper-2:#F3F5F3; --ink:#23292D; --ink-soft:#586166;
  --line:#9AA3A7; --cobalt:#2B46B0; --cobalt-l:#5A70CC;
  --face-l:#FBFCFA; --face-m:#EAEEEC; --face-m2:#DCE2E0; --face-r:#C6CFCD;
  --bud-l:#DCE2F5; --bud-m:#BFCAF0; --header:rgba(232,236,234,.86);
  --font:'Archivo','Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1B2124; --paper-2:#232A2E; --ink:#E4E8E6; --ink-soft:#A3ACB0;
    --line:#56616A; --cobalt:#93A6F2; --cobalt-l:#6F84D6;
    --face-l:#46505A; --face-m:#3B444B; --face-m2:#323A40; --face-r:#262D31;
    --bud-l:#44538C; --bud-m:#3A4878; --header:rgba(27,33,36,.86);
  }
  :root:not([data-theme="light"]) .plan{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
}
:root[data-theme="dark"]{
  --paper:#1B2124; --paper-2:#232A2E; --ink:#E4E8E6; --ink-soft:#A3ACB0;
  --line:#56616A; --cobalt:#93A6F2; --cobalt-l:#6F84D6;
  --face-l:#46505A; --face-m:#3B444B; --face-m2:#323A40; --face-r:#262D31;
  --bud-l:#44538C; --bud-m:#3A4878; --header:rgba(27,33,36,.86);
}
:root[data-theme="dark"] .plan{filter:invert(1) hue-rotate(180deg);mix-blend-mode:screen}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
.wrap{padding-inline:clamp(20px,5vw,72px)}

/* Header */
.top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  height:68px;background:var(--header);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity .6s ease,transform .6s ease}
body.ready .top{opacity:1;transform:none;pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-stretch:112%;font-weight:500;letter-spacing:.01em}
.brand svg{width:30px;height:22px}
.nav{position:relative}
.menu-btn{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:none;border:1px solid var(--ink);
  border-radius:999px;padding:8px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
.menu-btn svg{width:12px;height:12px;transition:transform .35s ease}
.menu-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:min(300px,86vw);background:var(--paper-2);
  border:1px solid var(--ink);padding:6px;visibility:hidden;clip-path:inset(0 0 100% 0);
  transition:clip-path .45s cubic-bezier(.65,0,.35,1),visibility 0s linear .45s}
.menu.open{visibility:visible;clip-path:inset(0 0 0 0);transition:clip-path .45s cubic-bezier(.65,0,.35,1)}
.menu a{display:block;text-decoration:none;padding:11px 12px;border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent)}
.menu a:last-child{border-bottom:0}
.menu a:hover{background:var(--paper)}
.menu span{display:block;font-weight:600;font-stretch:108%}
.menu small{display:block;font-size:13px;color:var(--ink-soft)}

/* Hero */
.hero{min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:center;
  gap:clamp(24px,4vw,64px);padding-top:92px;padding-bottom:40px;overflow:hidden}
.hero-text{opacity:0;transform:translateY(12px);transition:opacity .9s ease .15s,transform .9s ease .15s}
body.ready .hero-text{opacity:1;transform:none}
h1{margin:0;line-height:.9;font-weight:300}
h1 .n{display:block;font-size:clamp(40px,6.2vw,96px);font-stretch:125%;letter-spacing:-.02em}
h1 .r{display:block;font-size:clamp(26px,3.6vw,54px);font-stretch:62%;font-weight:600;letter-spacing:.01em;margin-top:.14em}
.second{margin:26px 0 0;padding-top:22px;border-top:1px solid var(--ink);line-height:.95}
.second .n{display:block;font-size:clamp(26px,3.4vw,50px);font-weight:400;font-stretch:112%;letter-spacing:-.01em}
.second .r{display:block;font-size:clamp(18px,2vw,28px);font-weight:600;font-stretch:62%;letter-spacing:.02em;margin-top:.2em;color:var(--ink-soft)}
.lead{max-width:30em;margin:28px 0 30px;font-size:clamp(17px,1.4vw,20px);color:var(--ink-soft)}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{display:inline-block;text-decoration:none;font-weight:500;font-size:16px;padding:12px 20px;border:1px solid var(--ink)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--cobalt);border-color:var(--cobalt)}
.btn.line:hover{background:var(--paper-2)}
.replay{margin-top:22px;font:inherit;font-size:14px;color:var(--ink-soft);background:none;border:0;padding:0;
  text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.stage{position:relative;width:min(720px,100%);justify-self:center;margin:0;will-change:transform}
.stage.settle{transition:transform 1.1s cubic-bezier(.65,0,.35,1)}
.frame{position:relative;width:100%;aspect-ratio:4/3;background:var(--paper)}
.frame img{position:absolute;inset:0;width:100%;height:100%;display:block}
.plan{object-fit:contain;mix-blend-mode:multiply;clip-path:inset(0 100% 0 0)}
.render{object-fit:cover;clip-path:circle(0% at 50% 50%)}
.lotus-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.caption{margin:10px 0 0;font-size:13px;color:var(--ink-soft);opacity:0;transition:opacity .8s ease .4s}
body.ready .caption{opacity:1}

.pod circle{stroke:var(--ink);stroke-width:.6}
.pod .pod-c{fill:var(--bud-l)}
.pod .seed{fill:var(--cobalt);stroke:none}
.petal path{stroke:var(--ink);stroke-width:.6;stroke-linejoin:round}
.petal .crease{fill:none;stroke-width:.5}

.skip{position:fixed;right:20px;bottom:20px;z-index:30;font:inherit;font-size:14px;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--ink);padding:8px 14px;cursor:pointer;transition:opacity .4s}
body.ready .skip{opacity:0;pointer-events:none}

/* Sections */
section{scroll-margin-top:80px}
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:clamp(24px,5vw,80px);
  padding-block:clamp(64px,10vw,140px)}
h2{margin:0;font-size:clamp(34px,4.4vw,60px);line-height:1;font-weight:400;font-stretch:120%;letter-spacing:-.015em}
.studio p{margin:0 0 1em;max-width:36em;font-size:clamp(18px,1.5vw,21px)}
.facts{display:flex;flex-wrap:wrap;gap:12px 40px;margin-top:28px;font-size:15px;color:var(--ink-soft)}
.facts strong{display:block;color:var(--ink);font-size:30px;font-weight:300;font-stretch:125%;line-height:1.1}

.sheet{border:1.5px solid var(--ink);padding:9px;background:var(--paper-2)}
.sheet-in{border:.75px solid var(--ink);padding:clamp(22px,4vw,56px);display:grid;gap:clamp(32px,4vw,56px)}
.sheet-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px}
.sheet-head p{margin:0;max-width:28em;color:var(--ink-soft)}
.services{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(28px,5vw,72px)}
.service{scroll-margin-top:90px}
.service h3{margin:0 0 10px;font-size:clamp(26px,2.6vw,36px);font-weight:600;font-stretch:70%;letter-spacing:.005em}
.service > p{margin:0 0 18px;max-width:32em}
.service ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.service li{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.service li::before{content:"";flex:none;width:9px;height:9px;transform:translateY(-1px) rotate(45deg);
  background:linear-gradient(90deg,var(--face-l) 50%,var(--cobalt) 50%);border:.75px solid var(--ink)}
.cartiglio{justify-self:end;width:min(360px,100%);display:grid;grid-template-columns:auto 1fr;border:1px solid var(--ink);font-size:14px;margin:0}
.cartiglio dt,.cartiglio dd{margin:0;padding:6px 10px;border-bottom:1px solid var(--ink)}
.cartiglio dt{color:var(--ink-soft);border-right:1px solid var(--ink)}
.cartiglio dt:last-of-type,.cartiglio dd:last-of-type{border-bottom:0}

/* Projects */
.projects{padding-block:clamp(64px,10vw,140px)}
.projects h2{margin-bottom:32px}
.project{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:clamp(14px,2vw,24px);
  padding-block:24px 48px;border-top:1px solid var(--ink)}
.project.flip{grid-template-columns:minmax(0,1fr) minmax(0,1.75fr)}
.project.flip .main{order:2}
.side{display:grid;gap:clamp(14px,2vw,24px);align-content:start}
.shot{padding:0;border:0;background:none;cursor:zoom-in;display:block;width:100%;overflow:hidden}
.shot img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .6s ease}
.shot:hover img{transform:scale(1.02)}
.wide .shot img{aspect-ratio:16/9}
.ptext h3{margin:0 0 4px;font-size:clamp(24px,2.4vw,32px);font-weight:400;font-stretch:112%;line-height:1.15}
.ptype{margin:0 0 12px;color:var(--ink-soft);font-size:15px}
.ptext p:last-child{margin:0;max-width:30em}

dialog{border:0;padding:0;background:transparent;max-width:min(1400px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(20,24,26,.88)}
dialog img{display:block;max-width:100%;max-height:84vh;object-fit:contain}
.lb-close{margin-top:10px;font:inherit;font-size:15px;color:#fff;background:none;border:1px solid #fff;padding:8px 16px;cursor:pointer}

.contact{background:var(--ink);color:var(--paper);padding-block:clamp(64px,10vw,130px)}
.contact h2{font-stretch:125%;font-size:clamp(40px,7vw,104px);font-weight:300}
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;margin-top:44px}
.contact-grid p{margin:0}
.contact-grid span{display:block;font-size:14px;opacity:.7;margin-bottom:4px}
.contact a{text-decoration-thickness:1px;text-underline-offset:4px}
.contact .btn{border-color:var(--paper);color:var(--ink);background:var(--paper);margin-top:40px}
.contact .btn:hover{background:transparent;color:var(--paper)}
footer{padding-block:24px;font-size:13px;color:var(--ink-soft);display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}

@media (max-width:899px){
  .hero{grid-template-columns:1fr;padding-top:84px}
  .stage{order:-1}
  .studio,.services,.contact-grid{grid-template-columns:1fr}
  .project,.project.flip{grid-template-columns:1fr}
  .project.flip .main{order:0}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{transition-duration:.01ms!important}
}

/* stile della pagina */
.home{min-height:100svh;display:grid;grid-template-rows:1fr auto;align-items:center;padding-block:32px 48px}
.lotus-wrap{width:min(520px,80vw);margin:0 auto;aspect-ratio:4/3}
.lotus-wrap .frame{position:relative;width:100%;aspect-ratio:4/3;background:var(--paper)}
.lotus-wrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px);max-width:1100px;margin:0 auto;width:100%;
  opacity:0;transform:translateY(14px);transition:opacity .9s ease,transform .9s ease}
body.ready .tiles{opacity:1;transform:none}
.tile{display:block;text-decoration:none;border:1px solid var(--ink);padding:clamp(22px,3vw,40px);min-height:200px;position:relative;background:var(--paper-2);transition:background .3s}
.tile:hover{background:var(--paper)}
.tile .who{display:block;font-size:clamp(28px,3.4vw,52px);line-height:1;font-weight:300;font-stretch:125%;letter-spacing:-.02em}
.tile .what{display:block;margin-top:10px;font-size:clamp(18px,1.8vw,26px);font-weight:600;font-stretch:62%;letter-spacing:.02em;color:var(--ink-soft)}
.tile .go{position:absolute;right:clamp(22px,3vw,40px);bottom:clamp(18px,2.4vw,32px);font-size:15px;color:var(--ink-soft)}
.tile:hover .go{color:var(--ink)}
.tile.soon{border-style:dashed}
.tile.pratica{grid-column:1/-1;min-height:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;padding-block:clamp(16px,2vw,24px)}
.tile.pratica .what{margin:0;font-size:clamp(15px,1.4vw,19px);text-transform:uppercase;letter-spacing:.14em}
.tile.pratica .who{font-size:clamp(22px,2.4vw,34px)}
.tile.pratica .go{position:static;margin-left:auto}
.tile.soon .go{font-style:normal}
.skip{position:fixed;right:20px;bottom:20px;z-index:30;font:inherit;font-size:14px;color:var(--ink);background:var(--paper-2);border:1px solid var(--ink);padding:8px 14px;cursor:pointer;transition:opacity .4s}
body.ready .skip{opacity:0;pointer-events:none}
@media (max-width:699px){.tiles{grid-template-columns:1fr}.tile{min-height:150px}.tile.pratica{min-height:0}.tile.pratica .go{margin-left:0}}
</style>
</head>
<body>
<main class="home wrap" id="top">
  <div class="lotus-wrap">
    <div class="frame">
      <img class="plan" id="planImg" src="../assets/pianta_generale.png" alt="Pianta generale di progetto">
      <svg id="svg1" viewBox="0 0 533 400" aria-hidden="true"><defs></defs><g id="lotus"></g></svg>
    </div>
  </div>
  <nav class="tiles" aria-label="Scegli">
    <a class="tile" href="../nicola.html">
      <span class="who">Franco Nicola</span>
      <span class="what">architetto</span>
      <span class="go">Apri il sito →</span>
    </a>
    <a class="tile soon" href="../pipicelli.html">
      <span class="who">Pipicelli DomenicAntonio</span>
      <span class="what">soluzioni ed idee</span>
      <span class="go">Pagina in arrivo →</span>
    </a>
    <a class="tile pratica" href="../fdf.html">
      <span class="what">Pratica</span>
      <span class="who">F.D.F. · Bosco Capitolo</span>
      <span class="go">Modello 3D dello stabilimento →</span>
    </a>
  </nav>
</main>
<button class="skip" id="skip" type="button">Salta l'animazione</button>
<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const lotus=document.getElementById('lotus');
  const body=document.body;
  const cl=v=>Math.max(0,Math.min(1,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const out=t=>1-Math.pow(1-t,3);
  const inout=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const back=t=>{const c1=1.4,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);};
  const el=(tag,attrs,parent)=>{const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;};
function gradients(svg,id){
  const defs=svg.querySelector('defs');
  const mk=(name,a,b)=>{
    const g=el('linearGradient',{id:id+name,x1:0,y1:0,x2:1,y2:0},defs);
    el('stop',{offset:0,style:`stop-color:var(${a})`},g);
    el('stop',{offset:1,style:`stop-color:var(${b})`},g);
  };
  mk('gl','--face-l','--face-m');
  mk('gr','--face-m2','--face-r');
  mk('bl','--bud-l','--bud-m');
  mk('br','--cobalt-l','--cobalt');
}
function makeLotus(svg,g,o){
  const id=svg.id;
  gradients(svg,id);
  const petals=[];
  const layers=[
    {n:8,L:132,w:33,a1:i=>-84+i*24,a2:i=>-157.5+i*45,delay:0},
    {n:5,L:96,w:27,a1:i=>-48+i*24,a2:i=>-144+i*72,delay:.22},
    {n:3,L:66,w:19,a1:i=>-18+i*18,a2:i=>[-120,0,120][i],delay:.44,bud:true}
  ];
  for(const ly of layers){
    const {L,w}=ly;
    const side=k=>`M0 0C${k*w*.95} ${-L*.2} ${k*w*1.12} ${-L*.56} ${k*w*.62} ${-L*.84}C${k*w*.34} ${-L*.98} ${k*w*.1} ${-L*1.0} 0 ${-L}`;
    const mid=`Q${w*.1} ${-L*.5} 0 0Z`;
    const left=side(-1)+mid, right=side(1)+mid;
    const crease=`M0 0Q${w*.1} ${-L*.5} 0 ${-L}M${-w*.5} ${-L*.3}Q${-w*.3} ${-L*.55} ${-w*.34} ${-L*.78}M${w*.55} ${-L*.3}Q${w*.4} ${-L*.55} ${w*.4} ${-L*.78}`;
    for(let i=0;i<ly.n;i++){
      const pg=el('g',{class:'petal'},g);
      el('path',{d:left,fill:`url(#${id}${ly.bud?'bl':'gl'})`},pg);
      el('path',{d:right,fill:`url(#${id}${ly.bud?'br':'gr'})`},pg);
      el('path',{d:crease,class:'crease'},pg);
      petals.push({g:pg,a1:ly.a1(i),a2:ly.a2(i),delay:ly.delay});
    }
  }
  const pod=el('g',{class:'pod',transform:`translate(${o.cx} ${o.cy})`},g);
  el('circle',{r:15,class:'pod-c'},pod);
  el('circle',{r:1.8,class:'seed'},pod);
  for(let k=0;k<6;k++){const a=k*Math.PI/3;el('circle',{r:1.6,class:'seed',cx:(Math.cos(a)*8).toFixed(2),cy:(Math.sin(a)*8).toFixed(2)},pod);}

  return function(t,p){
    g.style.opacity=cl(t/.4);
    const pu=inout(cl((t-p.u0)/p.ud));
    const stroke=p.stroke(t);
    for(const q of petals){
      const pb=cl((t-q.delay)/1.6);
      const a=lerp(lerp(q.a1*.08,q.a1,out(pb)),q.a2,pu);
      const s=lerp(lerp(o.s0,o.s1,back(pb)),o.s2,pu);
      const dy=lerp(o.dy,0,pu);
      q.g.setAttribute('transform',`translate(${o.cx} ${o.cy+dy}) rotate(${a.toFixed(2)}) scale(${s.toFixed(3)})`);
      q.g.style.fillOpacity=1-pu;
      q.g.style.strokeOpacity=stroke;
    }
    pod.style.opacity=pu*p.pod(t);
    pod.setAttribute('transform',`translate(${o.cx} ${o.cy}) scale(${lerp(.4,1,pu).toFixed(3)})`);
  };
}


  const lotus1=makeLotus(document.getElementById('svg1'),lotus,{cx:266.5,cy:200,s0:.55,s1:1,s2:1.25,dy:38});
  const END=4.6;
  let start=0,raf=0;
  function render(t){
    lotus1(t,{u0:1.9,ud:1.3,stroke:t=>lerp(1,.22,cl((t-3)/.9)),pod:t=>1-cl((t-3.2)/.8)});
    const planImg=document.getElementById('planImg');
    const pp=inout(cl((t-2.7)/1.1));
    planImg.style.clipPath=pp>=1?'none':`inset(0 ${(1-pp)*100}% 0 0)`;
    if(t>=3.4) body.classList.add('ready');
  }
  function tick(now){const t=(now-start)/1000;render(Math.min(t,END));if(t<END)raf=requestAnimationFrame(tick);}
  function finish(){cancelAnimationFrame(raf);render(END);}
  document.getElementById('skip').addEventListener('click',finish);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) finish();
  else {render(0);start=performance.now();raf=requestAnimationFrame(tick);}
})();
</script>
</body>
</html>
